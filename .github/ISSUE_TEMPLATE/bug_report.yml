name: Bug report
description: Report reproducible incorrect behavior in DECARB
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include private case data, credentials, or security reports.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a compact case or code sample and the command used.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DECARB version or commit
    validations:
      required: true
  - type: input
    id: julia
    attributes:
      label: Julia version
    validations:
      required: true
  - type: dropdown
    id: solver
    attributes:
      label: Solver
      options:
        - HiGHS
        - Gurobi
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
